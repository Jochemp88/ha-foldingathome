# Example dashboard for the Folding@home v8 integration.
# Replace "folding_pc" with the entity ID prefix of your machine.
# Paste into a new dashboard: ⋮ → Edit dashboard → ⋮ → Raw configuration editor.
title: Folding@home
views:
  - title: Folding@home
    path: folding
    icon: mdi:dna
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Folding-PC
            icon: mdi:desktop-tower
          - type: tile
            entity: sensor.folding_pc_status
            name: Status
            grid_options:
              columns: 12
          - type: gauge
            entity: sensor.folding_pc_progress
            name: Progress
            min: 0
            max: 100
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: sensor.folding_pc_points_per_day
            name: PPD
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.folding_pc_expected_finish
            name: Expected finish
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.folding_pc_work_unit_timeout
            name: Work unit timeout
            grid_options:
              columns: 12
          - type: tile
            entity: button.folding_pc_fold
            name: Fold
            vertical: true
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.folding_pc_fold
            grid_options:
              columns: 4
              rows: 2
          - type: tile
            entity: button.folding_pc_pause
            name: Pause
            vertical: true
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.folding_pc_pause
            grid_options:
              columns: 4
              rows: 2
          - type: tile
            entity: button.folding_pc_finish
            name: Finish
            vertical: true
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.folding_pc_finish
            grid_options:
              columns: 4
              rows: 2
      - type: grid
        cards:
          - type: heading
            heading: Work units
            icon: mdi:flask-outline
          # One block per work unit: type, progress, project (links to the
          # project page), expected finish as a clock time and PPD.
          - type: markdown
            content: |
              {% set units = state_attr('sensor.folding_pc_status', 'units') or [] %}
              {% set mult = {'d': 86400, 'h': 3600, 'm': 60, 's': 1} %}
              {% for u in units %}
              {% set ns = namespace(secs=0) %}
              {% for n, unit in (u.eta or '') | regex_findall('(\d+(?:\.\d+)?)\s*([dhms])') %}
              {% set ns.secs = ns.secs + n | float * mult[unit] %}
              {% endfor %}
              {% set done = (now() + timedelta(seconds=ns.secs)) | as_local %}
              {% set days = (done.date() - now().date()).days %}
              {% set ppd = u.ppd or 0 %}
              <ha-icon icon="{{ 'mdi:expansion-card' if u.type == 'gpu' else 'mdi:cpu-64-bit' }}"></ha-icon>&nbsp; **{{ u.type | upper }} · {{ u.progress | round(0) | int }} %**
              <sub>[Project {{ u.project }}](https://stats.foldingathome.org/project/{{ u.project }})
              {%- if not u.running %} · {{ 'paused' if u.state == 'RUN' else (u.state | lower) }}
              {%- elif ns.secs > 0 %} · done {{ 'tomorrow ' if days == 1 else (done.strftime('%a ') if days > 1 else '') }}{{ done.strftime('%H:%M') }}{% endif %}
              {%- if u.running and ppd > 0 %} · {{ '%.2fM' | format(ppd / 1000000) if ppd >= 1000000 else '%dk' | format(ppd // 1000) }} PPD{% endif %}</sub>

              {% else %}
              No work units right now.
              {% endfor %}
      - type: grid
        cards:
          - type: heading
            heading: Statistics
            icon: mdi:chart-line
          - type: tile
            entity: sensor.folding_home_statistics_total_points
            name: Total points
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.folding_home_statistics_work_units
            name: Work units
          - type: tile
            entity: sensor.folding_home_statistics_rank
            name: Rank
          - type: tile
            entity: sensor.folding_home_statistics_team_rank
            name: Team rank
          - type: tile
            entity: sensor.folding_home_statistics_last_credited_work_unit
            name: Last credited WU
